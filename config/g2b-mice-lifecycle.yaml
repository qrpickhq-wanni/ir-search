    - 운영 대행
    - 국제회의
    - 국제행사
    - 컨벤션
    - 컨퍼런스
    - 포럼
    - 세미나
    - 심포지엄
    - 학술대회
    - 박람회
    - 전시회
    - 수출상담회
    - 구매상담회
    - 비즈니스 매칭
    - 투자상담회
    - 설명회
    - 성과공유회
    - 데모데이
    - 오픈이노베이션
    - 네트워킹
  qrpick_showda:
    - 참가자 등록
    - 사전등록
    - 현장등록
    - 참가자 관리
    - 행사 홈페이지
