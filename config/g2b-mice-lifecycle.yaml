    - 다국어
    - CRM

sales_windows:
  award_winner_days_after_award: 30
  pre_registration_min_days_to_event: 45
  direct_bid_min_days_to_deadline: 3
  late_event_max_days_to_event: 21
  next_cycle_months_before_prior_announcement: 2

sales_priority:
  P0_days_to_deadline_max: 14
  P1_days_to_deadline_max: 45
  P2_days_to_deadline_max: 120

previous_cycle:
  strong_requires:
    - same_organization
    - year_stripped_title_core
  medium_allows_weak_title: false
  exclude_confidence_below: MEDIUM
