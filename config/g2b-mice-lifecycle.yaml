# G2B MICE procurement lifecycle MVP — official data.go.kr OpenAPI only.
# Endpoints verified from Public Data Portal pages (not guessed).
#
# Bid notices:  https://www.data.go.kr/data/15129394/openapi.do
#   Service URL: http://apis.data.go.kr/1230000/ad/BidPublicInfoService
# Awards:       https://www.data.go.kr/data/15129397/openapi.do
#   Service URL: http://apis.data.go.kr/1230000/as/ScsbidInfoService
# Pre-specs:    https://www.data.go.kr/data/15129437/openapi.do
#   Service URL: http://apis.data.go.kr/1230000/ao/HrcspSsstndrdInfoService
# Contracts:    https://www.data.go.kr/data/15129427/openapi.do
#   Service URL: http://apis.data.go.kr/1230000/ao/CntrctInfoService
#
# Auth: apply for each dataset on data.go.kr; set env DATA_GO_KR_SERVICE_KEY
# (same key often works across PPS services after approval). Never commit keys.

collector_version: "1.0.0"
record_domain: PROCUREMENT_OPPORTUNITY
source_scope: G2B_OFFICIAL_OPENAPI

http:
  request_delay_seconds: 0.5
  request_timeout_seconds: 20
  max_retries: 2
  retry_backoff_seconds: 1.0
  user_agent: "QRPickG2BMiceMVP/1.0 (+internal research; polite; delay>=0.5s)"
  max_requests_per_run: 200

limits:
  max_records_per_stage: 500
  max_pages_per_query: 20
  num_of_rows: 100

windows:
  bid_notice_past_days: 180
  award_contract_past_days: 548   # ~18 months
  previous_cycle_lookback_years: 1
  previous_cycle_extend_years: 2  # only when prior-year missing / biennial

auth:
  env_var: DATA_GO_KR_SERVICE_KEY
  alt_env_vars:
    - G2B_SERVICE_KEY
    - PUBLIC_DATA_SERVICE_KEY
  apply_urls:
    - https://www.data.go.kr/data/15129394/openapi.do
    - https://www.data.go.kr/data/15129397/openapi.do
    - https://www.data.go.kr/data/15129437/openapi.do
    - https://www.data.go.kr/data/15129427/openapi.do

openapi:
  base_host: https://apis.data.go.kr
  type: json
  # 용역(service) operations only for MICE MVP
  bid_notice:
    service_path: /1230000/ad/BidPublicInfoService
    list_operation: getBidPblancListInfoServc
    search_operation: getBidPblancListInfoServcPPSSrch
    dataset_url: https://www.data.go.kr/data/15129394/openapi.do
  pre_notice:
    service_path: /1230000/ao/HrcspSsstndrdInfoService
    list_operation: getPublicPrcureThngInfoServc
    search_operation: getPublicPrcureThngInfoServcPPSSrch
    dataset_url: https://www.data.go.kr/data/15129437/openapi.do
  award_result:
    service_path: /1230000/as/ScsbidInfoService
    list_operation: getScsbidListSttusServc
    opening_operation: getOpengResultListInfoServc
    search_operation: getScsbidListSttusServcPPSSrch
    dataset_url: https://www.data.go.kr/data/15129397/openapi.do
  contract_result:
    service_path: /1230000/ao/CntrctInfoService
    list_operation: getCntrctInfoListServc
    search_operation: getCntrctInfoListServcPPSSrch
    dataset_url: https://www.data.go.kr/data/15129427/openapi.do

# Keyword batches — title search via PPS operations (bidNtceNm / prdctClsfcNoNm where supported)
search_keywords:
  mice_event:
