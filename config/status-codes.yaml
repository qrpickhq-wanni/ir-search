# First-pass status codes. Scores only rank review order — never final GO/NO-GO.

statuses:
  HIGH_PRIORITY:
    meaning: QRPick 코어·확장 사업과 직접 연관성이 높고 상세검토 가치가 큼
    caution: 지원 가능을 확정한다는 의미는 아님
  REVIEW:
    meaning: 연관성은 있으나 지원형태 또는 실제 효익 검토 필요
  DETAIL_REVIEW:
    meaning: 제목만으로 판단할 수 없어 상세 공고문 확인 필요
  LOW_FIT:
    meaning: QRPick 제품과 직접 관련성이 낮거나 대상이 명확히 부적합
  EXPIRED:
    meaning: 마감 종료
  UNKNOWN:
    meaning: 날짜·제목·소스 등 데이터 부족 또는 처리 불가

top_question: >
  “현재 QRPick 기능을 그대로 적용할 수 있는가?”만 묻지 말고,
  “QRPick 또는 쇼다의 기술·운영·기획·개발·마케팅 자산과 대표자 수행경력을 활용하여
  직접 공급, 확장 개발, 신규 구축용역, 운영용역, 공동수행 또는 영업기회로 전환할 수 있는가?”를 판단한다.

warnings:
  - 자동 상태/점수는 검토 순서용이며 최종 지원 가능 여부나 GO/NO-GO가 아니다.
  - 자격요건은 상세 공고 원문 없이 확정하지 않는다.
  - 회사 소재지·업력이 TODO이면 지역·업력 제한 공고는 DETAIL_REVIEW로 남긴다.
  - 산업분야 명칭만으로 제외하지 않는다. 과업이 행사·플랫폼·웹·데이터·마케팅·운영이면 검토한다.
  - 강한 저적합은 전문산업 산출물+SW역할부재+구축경로없음+파트너가능성낮음이 모두 성립할 때만.
