# Rule-based first-pass scoring + asset-fit signals (no LLM).
# Top question: Can QRPick/Showda assets convert this into supply, build, ops, consortium, or sales?

base_score: 30

scoring:
  event_types:
    points_per_hit: 5
    max_points: 25
  ops_infra:
    points_per_hit: 6
    max_points: 30
  core_mice:
    points_per_hit: 8
    max_points: 32
  tourism_extension:
    points_per_hit: 6
    max_points: 24
  extension_broad:
    points_per_hit: 4
    max_points: 20
  technology:
    points_per_hit: 4
    max_points: 16
  service_build:
    points_per_hit: 6
    max_points: 24
  program_value:
    points_per_hit: 7
    max_points: 21
  export_market:
    points_per_hit: 5
    max_points: 10
  combo_two_high_groups: 18
  combo_three_high_groups: 28

penalties:
  trainee_individual:
    points: -25
  space_only:
    points: -20
  mentoring_only:
    points: -12
  strong_domain_mismatch:
    points: -20
  pre_startup_only:
    points: -40
  student_only:
    points: -40

