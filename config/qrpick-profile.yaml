judgment_principle: >
  공고 적합성을 QRPick 기존 기능 일치 여부에만 한정하지 않는다.
  QRPick·쇼다의 기술·운영·기획·개발·마케팅 자산과 대표자 수행경력을 활용해
  직접 공급, 확장 개발, 신규 구축용역, 운영용역, 공동수행, 영업기회로
  전환할 수 있는지를 최상위로 판단한다.

