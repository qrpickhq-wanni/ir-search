# Direct / consortium bid assessment rules for Showda · QRPick.
# Used by app/evaluators/bid_assessment.py — keyword evidence only; never invent qualifications.

# Industry names alone must not exclude direct-bid routes when SW/ops role signals exist.
never_exclude_on_industry_alone: true

